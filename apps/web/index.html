<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` below resolve to anything but 0 on a
         notched phone. Without it an installed PWA letterboxes itself instead of using the full screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Goal Cascade</title>
    <meta name="description" content="Life goals, cascaded down to what you are actually doing this week." />

    <!-- PWA. There is deliberately no manifest link tag here: vite-plugin-pwa injects one at build time, and
         writing a second by hand puts two of them in `dist/index.html` (verified — it does not dedupe).
         `tests/pwa/manifest.test.ts` guards that.
         `theme-color` must match `MANIFEST_THEME_COLOR` / `MANIFEST_DARK_THEME_COLOR` in `src/pwa/manifest.ts`
         (which in turn track `colors.paper` / `colors.ink` in `src/ui.ts`) — the same test reads this file and
         fails if the three drift apart. -->
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c19" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cascade" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <style>
      /*
       * Manrope and Newsreader are self-hosted from `public/fonts` rather than loaded from Google Fonts. Two
       * reasons: `default-src 'self'` in `public/_headers` stays clean with no third-party origin in the CSP,
       * and the woff2 files are precached by the service worker (see `injectManifest.globPatterns`), so an
       * offline open renders in the real typefaces instead of silently falling back to the system font.
       * The files are the latin / latin-ext subsets of the *variable* fonts — one file covers 400–800 for
       * Manrope and 400–500 italic for Newsreader, which is why there is one @font-face per subset, not per
       * weight. Regenerate by re-downloading the URLs in a Google Fonts css2 response for the same families.
       */
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/manrope-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/manrope-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Newsreader';
        font-style: italic;
        font-weight: 400 500;
        font-display: swap;
        src: url('/fonts/newsreader-italic-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Newsreader';
        font-style: italic;
        font-weight: 400 500;
        font-display: swap;
        src: url('/fonts/newsreader-italic-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      /*
       * `html` owns the page colour, not `#root`: that is what propagates to the viewport canvas, so it also
       * covers the gutters beside the centred 640px column, the safe-area strips, and the overscroll rubber
       * band. The literal is `colors.paper` from `src/ui.ts` — the first-paint value, before React mounts.
       */
      html, body { margin: 0; padding: 0; }
      html { background: #f6f6f3; color-scheme: light; }
      /*
       * The body carries NO background of its own. It used to repeat the light `#f6f6f3` and pin
       * `color-scheme: light`, both of which survived a switch to dark: native controls, scrollbars and form
       * widgets kept rendering for a light page inside the dark app (the browser walkthrough's finding C —
       * the default blue focus ring on the done-condition input), and a light body sat under a dark app
       * waiting to flash. `color-scheme` is inherited, so `html`'s value — rewritten from the active theme by
       * `applyDocumentTheme` — now reaches every control, and `html`'s background is the only page colour.
       *
       * These two literals are the FIRST-PAINT values only, before React mounts: they can follow nothing but
       * `prefers-color-scheme` (the CSP forbids an inline script that could read the stored choice), and
       * `main.tsx` repaints from the stored preference before the tree renders.
       */
      @media (prefers-color-scheme: dark) {
        html { background: #1c1c19; color-scheme: dark; }
      }
      * { box-sizing: border-box; }
      a { color: oklch(0.45 0.09 125); }
      a:hover { color: oklch(0.35 0.09 125); }
      button, input, textarea, select { font-family: 'Manrope', sans-serif; }
      /*
       * The focus ring is the app's own — `colors.green` / `DARK.green`, kept live in `--focus-ring` by
       * `applyDocumentTheme`. Without it the browser draws its default (blue on a light page, white on a
       * dark one), which is the one piece of chrome in this app nobody chose. `:focus-visible`, so a mouse
       * click on a button does not draw one; `:where()`, so a component's own inline styles still win.
       *
       * `[tabindex]` is narrowed to exclude `-1`. An element with `tabindex="-1"` is not a tab stop: it is
       * only ever focused by script, which in this app means the sheet's `<h2>` — focused on open so a
       * screen reader announces the dialog's title. That is right for announcement and wrong for a ring:
       * the walkthrough saw a full-width green box drawn round `New goal` (re-verification nit 3). Nothing
       * genuinely interactive loses anything — `a`, `button`, `input`, `select` and `textarea` still match
       * on their own, whatever their tabindex.
       */
      :root { --focus-ring: oklch(0.55 0.11 125); }
      @media (prefers-color-scheme: dark) {
        :root { --focus-ring: oklch(0.68 0.11 125); }
      }
      :where(a, button, input, select, textarea, [tabindex]:not([tabindex="-1"])):focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }
      /*
       * Installed on a notched phone, the scrolling column has to clear the status bar and the display
       * cutouts. The bottom inset is deliberately *not* applied here — the tab bar is `position: fixed` and
       * padding on `#root` would not move it — so it is published as a custom property for the tab bar and
       * any other fixed chrome to consume.
       */
      :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
      /*
       * The top inset, published for the same reason as `--safe-bottom`: the lens tab strip and the period
       * row are `position: sticky` as one block (R-lens-33, sticky per the owner's override of
       * `29-ux-navigation` §2.7), so `top: 0` alone would pin them under a notched phone's status bar.
       * `#root` already pads the same inset, so nothing scrolls through the strip above the pinned block.
       */
      :root { --safe-top: env(safe-area-inset-top, 0px); }
      /*
       * R-lens-33 — the lens tab strip is an ordinary horizontal scroller and must not draw a scrollbar
       * under five words of chrome. Firefox is handled inline with `scrollbar-width: none`; this is the
       * WebKit half, which has no inline-style spelling.
       */
      [data-lens-tabs]::-webkit-scrollbar { display: none; }
      #root { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
